meters:
- name: subscribed_users
  description: Licensed user seats on a Cropwise Operations company account.
  unit: users
  aggregation: max
  dimensions:
  - account
- name: managed_hectares
  description: Managed area allowance per company account (area_limit).
  unit: hectares
  aggregation: max
  dimensions:
  - account
- name: satellite_imagery_module
  description: Optional satellite/NDVI imagery module, if separately licensed.
  unit: fields
  aggregation: sum
  dimensions:
  - account
- name: telematics_module
  description: Optional machinery/telematics (GPS) module, if separately licensed.
  unit: machines
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track licensed user seats and the managed-hectare allowance per company account against actual field/farm size under management.
- name: Allocation
  description: Map Cropwise Operations subscription cost to the farms/business units whose fields, crops, and machinery are tracked in the account.
- name: Optimization
  description: Right-size user seats and confirm which optional modules (satellite/NDVI, weather, telematics) are actually in use before renewal.
- name: Accountability
  description: Assign an account owner to review the annual Cropwise Operations subscription and confirm the managed-area allowance still matches farmed acreage.
