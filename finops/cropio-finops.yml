description: >-
  FinOps view of Cropio (Cropwise Operations) spend. There is no separate API
  bill - the API is included with a Cropwise Operations subscription, which is
  licensed per account, historically on a per-user, per-year basis with a
  managed-area (hectare) allowance per company (see the `area_limit` field on
  the Company API resource). Cropio itself was absorbed into Syngenta in 2019;
  invoicing, if applicable, would come from Syngenta / Cropwise, not a
  standalone "Cropio" entity. No public FOCUS-aligned rate card is published.
notes: >-
  Cost drivers are the subscription tier (user seats, managed hectares, and
  which modules - satellite/NDVI, weather, telematics, scouting - are included)
  rather than API call volume. Verify current invoicing structure directly with
  Cropwise/Syngenta sales, since public per-unit rates are not reconciled here.
