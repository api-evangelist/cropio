name: Cropio
kind: company
description: Cropio was an independent Eastern European farm management and precision
  agriculture platform (fields, satellite/NDVI imagery, weather, scouting, machinery
  telematics, and yield) founded in 2013. Syngenta acquired Cropio in September 2019
  and folded it into its Cropwise digital agriculture portfolio; the product now
  operates as Cropwise Operations, and cropio.com redirects to
  operations.cropwise.com. The original Cropio API v3 was not shut down - it
  continues to run as the documented Cropwise Operations Platform API v3, reachable
  at operations.cropwise.com/api/v3 (the legacy cropio.com/api/v3 host has redirected
  there since April 1, 2022). It is a per-account HTTP JSON REST API (not a
  self-serve developer marketplace) - a Cropwise Operations login is required to
  obtain a USER_API_TOKEN, and there is no published self-signup API key flow or
  API-specific price list. Syngenta separately launched a broader "Cropwise Open
  Platform" for partners in 2025, which is a distinct, newer developer program
  outside the scope of this entry.
